version: 2

models:
  - name: stg_spotify_charts
    description: "Cleaned and typed version of the raw Spotify chart data. One row per song."
    columns:
      - name: artist_name
        description: "Artist name. Missing values are recovered from artist_and_title."
        tests:
          - not_null
      - name: song_name
        description: "Song title."
        tests:
          - not_null
      - name: lyrics
        description: "Full song lyrics."
      - name: peak_position
        description: "Best chart position the song reached."
        tests:
          - not_null
      - name: weeks_at_peak
        description: "Weeks spent at the peak position. Cleaned from values like '(x13)'; defaults to 1 when empty."
      - name: weeks_charted
        description: "Total weeks the song was on the chart."
      - name: weeks_top10
        description: "Weeks the song spent in the top 10."
      - name: peak_week_streams
        description: "Streams during the song's best week."
      - name: total_streams
        description: "Lifetime total streams while charting."

  - name: stg_musicbrainz_artist_genres
    description: "Cleaned and typed MusicBrainz genres. One row per artist + genre; artists that were looked up but not found, or have no genres, keep one row with a null genre."
    columns:
      - name: artist_name
        description: "Artist name as it appears in the chart data (join key to dim_artist)."
        tests:
          - not_null
      - name: musicbrainz_id
        description: "MusicBrainz artist ID (MBID). Null when the artist wasn't found."
      - name: musicbrainz_artist_name
        description: "Artist name as MusicBrainz spells it."
      - name: match_score
        description: "MusicBrainz search score (0-100). Only matches of 90+ are kept."
      - name: genre
        description: "Detailed MusicBrainz genre, lowercase (e.g. 'dance-pop')."
      - name: genre_votes
        description: "Number of MusicBrainz users who tagged the artist with this genre."
      - name: extracted_at
        description: "When the extract script ran (UTC)."

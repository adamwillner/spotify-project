version: 2

models:
  - name: dim_artist
    description: "One row per artist, with a broad genre from MusicBrainz. Surrogate key is a hash of artist_name."
    columns:
      - name: artist_id
        description: "Surrogate key, hashed from artist_name."
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "Artist name as it appears in the source data."
      - name: genre
        description: "Broad genre from MusicBrainz (via int_artist_genre). 'Unclassified' when the artist isn't among the top artists looked up, wasn't found, or has no genres."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Pop', 'Hip-Hop', 'R&B', 'Latin', 'Rock', 'Electronic', 'Country', 'Afrobeats', 'Other', 'Unclassified']

  - name: dim_song
    description: "One row per song. Keyed on artist + song, because 423 song titles are shared by different artists."
    columns:
      - name: song_id
        description: "Surrogate key, hashed from artist_name + song_name."
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "Artist of the song."
      - name: song_name
        description: "Song title."
      - name: lyrics
        description: "Full song lyrics."

  - name: fct_chart_performance
    description: "Chart performance per song. One row per song, linked to dim_artist and dim_song. Lifetime totals, not time series."
    columns:
      - name: song_id
        description: "Foreign key to dim_song."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_song')
                field: song_id
      - name: artist_id
        description: "Foreign key to dim_artist."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_artist')
                field: artist_id
      - name: peak_position
        description: "Best chart position the song reached."
      - name: weeks_at_peak
        description: "Weeks spent at the peak position."
      - name: weeks_charted
        description: "Total weeks on the chart."
      - name: weeks_top10
        description: "Weeks in the top 10."
      - name: total_streams
        description: "Lifetime total streams while charting."
      - name: lyrics_char_count
        description: "Number of characters in the lyrics."
